name: Build Myzumi Wine Latest Yolk

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: wine-latest-yolk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify Debian base exists
        shell: bash
        run: |
          set -euo pipefail
          IMAGE="ghcr.io/myzumi/yolks:debian"
          if ! docker buildx imagetools inspect "$IMAGE" >/dev/null 2>&1; then
            echo "::error title=Missing Debian base::$IMAGE is not available. Run the 'Build Myzumi Debian Base Yolk' workflow first."
            exit 1
          fi
          echo "Using base image: $IMAGE"

      - name: Verify Debian base ABI for native Havok
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm ghcr.io/myzumi/yolks:debian sh -lc '
            set -eu
            GLIBC_VERSION="$(ldd --version | head -1 | awk "{print \$NF}")"
            echo "glibc: $GLIBC_VERSION"
            dpkg --compare-versions "$GLIBC_VERSION" ge "2.38"
            strings /usr/lib/x86_64-linux-gnu/libstdc++.so.6 | grep -qx "GLIBCXX_3.4.32"
            echo "Required ABI present: GLIBC >= 2.38 and GLIBCXX_3.4.32"
          '

      - name: Build and publish Wine latest
        uses: docker/build-push-action@v6
        with:
          context: ./wine
          file: ./wine/latest/Dockerfile
          push: true
          pull: true
          platforms: linux/amd64
          tags: |
            ghcr.io/myzumi/yolks:wine_latest
          cache-from: type=gha,scope=myzumi-wine-latest
          cache-to: type=gha,mode=max,scope=myzumi-wine-latest
