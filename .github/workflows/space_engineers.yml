name: Build Space Engineers Yolk

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify Wine base exists
        shell: bash
        run: |
          set -euo pipefail
          IMAGE="ghcr.io/myzumi/yolks:wine_latest"
          if ! docker buildx imagetools inspect "$IMAGE" >/dev/null 2>&1; then
            echo "::error title=Missing Wine base::$IMAGE is not available. Run the 'Build Myzumi Wine Latest Yolk' workflow first."
            exit 1
          fi
          echo "Using base image: $IMAGE"

      - name: Build and publish
        uses: docker/build-push-action@v6
        with:
          context: ./games/space_engineers
          file: ./games/space_engineers/Dockerfile
          push: true
          pull: true
          platforms: linux/amd64
          tags: |
            ghcr.io/myzumi/yolks:space_engineers
          cache-from: type=gha
          cache-to: type=gha,mode=max
