name: Build Space Engineers Quasar Yolk

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: space-engineers-quasar-yolk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish Quasar yolk
        uses: docker/build-push-action@v6
        with:
          context: ./games/space_engineers_quasar
          file: ./games/space_engineers_quasar/Dockerfile
          push: true
          platforms: linux/amd64
          tags: |
            ghcr.io/myzumi/yolks:space_engineers_quasar
          cache-from: type=gha,scope=space-engineers-quasar
          cache-to: type=gha,mode=max,scope=space-engineers-quasar
