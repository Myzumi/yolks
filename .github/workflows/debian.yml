name: Build Myzumi Debian Base Yolk

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: debian-base-yolk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish Debian base
        uses: docker/build-push-action@v6
        with:
          context: ./oses/debian
          file: ./oses/debian/Dockerfile
          push: true
          pull: true
          platforms: linux/amd64
          tags: |
            ghcr.io/myzumi/yolks:debian
          cache-from: type=gha,scope=myzumi-debian-base
          cache-to: type=gha,mode=max,scope=myzumi-debian-base
